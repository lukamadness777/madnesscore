plugins {
    id 'multiloader-common'
}

configurations {
    commonJava { canBeResolved = true }
    commonResources { canBeResolved = true }
    commonClientJava { canBeResolved = true }
    commonClientResources { canBeResolved = true }
}

dependencies {
    compileOnly(project(':common')) { capabilities { requireCapability "$group:$mod_id" } }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
    commonClientJava project(path: ':common', configuration: 'commonClientJava')
    commonClientResources project(path: ':common', configuration: 'commonClientResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

gradle.projectsEvaluated {
    def clientJavaTask = tasks.findByName('compileClientJava')
    if (clientJavaTask != null) {
        clientJavaTask.configure {
            dependsOn(configurations.commonClientJava)
            source(configurations.commonClientJava)
        }
    } else {
        tasks.named('compileJava', JavaCompile) {
            dependsOn(configurations.commonClientJava)
            source(configurations.commonClientJava)
        }
    }

    def clientResTask = tasks.findByName('processClientResources')
    if (clientResTask != null) {
        clientResTask.configure {
            dependsOn(configurations.commonClientResources)
            from(configurations.commonClientResources)
        }
    } else {
        tasks.named('processResources') {
            dependsOn(configurations.commonClientResources)
            from(configurations.commonClientResources)
        }
    }

    tasks.named('javadoc', Javadoc) {
        dependsOn(configurations.commonJava, configurations.commonClientJava)
        source(configurations.commonJava)
        source(configurations.commonClientJava)

        def clientSourceSet = sourceSets.findByName('client')
        if (clientSourceSet != null) {
            classpath += clientSourceSet.compileClasspath
        }
    }
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava, configurations.commonResources,
            configurations.commonClientJava, configurations.commonClientResources)
    from(configurations.commonJava)
    from(configurations.commonResources)
    from(configurations.commonClientJava)
    from(configurations.commonClientResources)
}

tasks.named('javadoc', Javadoc) {
    dependsOn(configurations.commonJava, configurations.commonClientJava)
    source(configurations.commonJava)
    source(configurations.commonClientJava)
}