plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"

    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    modCompileOnly "xaero.map:xaeroworldmap-fabric-${minecraft_version}:${xaeroworldmap_version}"
    modCompileOnly "xaero.minimap:xaerominimap-fabric-${minecraft_version}:${xaerominimap_version}"
    modCompileOnly "info.journeymap:journeymap-api-fabric:${journeymap_api_version}-${minecraft_version}"
    modCompileOnly "maven.modrinth:nvQzSEkH:adpNvTZS"

    modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    modLocalRuntime "mysticdrew:common-networking-fabric:${commonnetworking_version}-${minecraft_version}"
    modLocalRuntime "info.journeymap:journeymap-api-fabric:${journeymap_api_version}-${minecraft_version}"
    modLocalRuntime "maven.modrinth:nvQzSEkH:adpNvTZS"
    modLocalRuntime "maven.modrinth:lfHFW1mp:qmuZAgdA"
    modCompileOnly "maven.modrinth:1W98a849:eUYBilCG"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    splitEnvironmentSourceSets()

    interfaceInjection {
        enableDependencyInterfaceInjection = false
    }

    sourceSets {
        client
        main {
            resources {
                srcDir 'src/main/generated'
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        datagen {
            inherit server
            source sourceSets.client
            name 'Data Generation'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/main/generated')}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            setConfigName('Fabric Datagen')
            ideConfigGenerated(true)
            runDir('runs/datagen')
        }
    }
}
